<!doctype html>
<html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · Bisno</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#17251d;background:#f4f7f5;--green:#176b45;--line:#dfe7e1}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:var(--green);color:white;font-weight:650}button.secondary{background:#e7eee9;color:#173b2b}button.danger{background:#b42318}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#102e21;color:#fff;padding:25px 16px}.brand{font-size:23px;font-weight:850;margin:0 8px 6px}.sub{color:#b9d3c4;margin:0 8px 30px;font-size:13px}.nav{display:grid;gap:8px}.nav button{background:transparent;text-align:left;color:#d8e9de}.nav button.active,.nav button:hover{background:#24563e;color:white}.main{padding:28px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:26px}.muted{color:#68786f;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:13px;margin:20px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.card span{display:block;color:#65766b;font-size:13px}.card strong{display:block;font-size:27px;margin-top:8px}.panel{margin-top:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tools input,.tools select{padding:10px;border:1px solid #ccd8cf;border-radius:9px;background:#fff;min-width:130px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #edf1ee;font-size:13px}th{color:#63756a;background:#f8faf8;font-weight:700}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;background:#e1f3e8;color:#176b45}.pill.blocked{background:#fee4e2;color:#a11d16}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:7px 9px}.hidden{display:none}.notice{padding:12px;border-radius:9px;background:#e1f3e8;margin-bottom:14px}.error{background:#fee4e2;color:#9b1c15}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.empty{padding:24px;text-align:center;color:#718076}.chartrow{display:grid;grid-template-columns:1fr 1fr;gap:15px}.barline{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px}.bar{height:9px;border-radius:6px;background:#278657;min-width:2px}.loginmsg{max-width:600px;margin:10vh auto;padding:30px}.logout{margin-top:30px;width:100%}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:16px}.brand{display:inline-block}.sub{display:inline-block;margin-bottom:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.logout{width:auto;margin-top:0}.main{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.chartrow{grid-template-columns:1fr}.top h1{font-size:21px}}@media(max-width:420px){.cards{grid-template-columns:1fr 1fr}.card{padding:13px}.card strong{font-size:22px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">Bisno <span style="color:#9bd4b4">Admin</span></div><p class="sub">Painel privado de gestão</p><nav class="nav"><button class="active" data-tab="overview">Visão geral</button><button data-tab="users">Utilizadores</button><button data-tab="products">Anúncios</button><button data-tab="audit">Auditoria</button></nav><button class="secondary logout" id="logout">Voltar ao Bisno</button></aside><main class="main"><div class="top"><div><h1 id="title">Visão geral</h1><div class="muted">Gestão privada da plataforma</div></div><button class="secondary" id="refresh">Atualizar</button></div><div id="message" class="hidden"></div>
<section id="overview"><div id="cards" class="cards"></div><div class="chartrow"><div class="panel"><h3>Novos registos · 30 dias</h3><div id="regchart"></div></div><div class="panel"><h3>Anúncios publicados · 30 dias</h3><div id="prodchart"></div></div></div></section>
<section id="users" class="hidden"><div class="panel"><div class="tools"><input id="usersearch" placeholder="Nome, e-mail ou ID"><select id="userstatus"><option value="">Todos os estados</option><option value="active">Ativos</option><option value="blocked">Bloqueados</option></select><button id="userfind">Pesquisar</button></div><div class="tablewrap"><table><thead><tr><th>ID / Utilizador</th><th>Contacto</th><th>Registo</th><th>Anúncios</th><th>Estado</th><th>Ações</th></tr></thead><tbody id="usertable"></tbody></table></div><div class="pagination"><span id="userpage"></span><div><button class="secondary" id="userprev">Anterior</button> <button class="secondary" id="usernext">Seguinte</button></div></div></div></section>
<section id="products" class="hidden"><div class="panel"><div class="tools"><input id="productsearch" placeholder="Anúncio, vendedor ou ID"><select id="productstatus"><option value="">Todos os estados</option><option value="active">Ativos</option><option value="blocked">Suspensos</option></select><button id="productfind">Pesquisar</button></div><div class="tablewrap"><table><thead><tr><th>Anúncio</th><th>Preço</th><th>Categoria / Local</th><th>Vendedor</th><th>Estado</th><th>Ações</th></tr></thead><tbody id="producttable"></tbody></table></div><div class="pagination"><span id="productpage"></span><div><button class="secondary" id="productprev">Anterior</button> <button class="secondary" id="productnext">Seguinte</button></div></div></div></section>
<section id="audit" class="hidden"><div class="panel"><div class="tablewrap"><table><thead><tr><th>Data</th><th>Administrador</th><th>Ação</th><th>Alvo</th><th>Motivo</th></tr></thead><tbody id="audittable"></tbody></table></div><div class="pagination"><span id="auditpage"></span><div><button class="secondary" id="auditprev">Anterior</button> <button class="secondary" id="auditnext">Seguinte</button></div></div></div></section>
</main></div>
<script>
"use strict";
const $=s=>document.querySelector(s);let active="overview";const pages={users:1,products:1,audit:1};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v){return new Intl.NumberFormat("pt-AO").format(Number(v)||0)+" Kz";}
function date(v){return v?esc(new Date(v.replace(" ","T")+"Z").toLocaleString("pt-AO")):"—";}
function msg(text,error=false){const el=$("#message");el.textContent=text;el.className="notice"+(error?" error":"");}
async function api(path,opts={}){const res=await fetch("/api/admin"+path,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});let data={};try{data=await res.json()}catch{}if(res.status===401||res.status===403){msg(data.erro||"Acesso não autorizado. Inicia sessão com a conta administradora.",true);throw Error(data.erro||"Acesso não autorizado");}if(!res.ok)throw Error(data.erro||"O pedido falhou.");return data;}
function safeAction(fn){return async()=>{try{await fn();}catch(e){msg(e.message,true);}}}
function chart(el,rows){const max=Math.max(1,...rows.map(x=>x.count));el.innerHTML=rows.length?rows.map(x=>'<div class="barline"><span style="width:82px">'+esc(x.day)+'</span><div class="bar" style="width:'+Math.max(2,x.count/max*60)+'%"></div><b>'+x.count+'</b></div>').join(""):'<div class="empty">Sem dados históricos disponíveis.</div>';}
async function overview(){const d=await api("/stats");const s=d.stats;const cards=[["Utilizadores",s.users],["Novos · 24 h",s.users24h],["Novos · 7 dias",s.users7d],["Novos · 30 dias",s.users30d],["Anúncios",s.products],["Anúncios ativos",s.activeProducts],["Anúncios suspensos",s.blockedProducts],["Contas bloqueadas",s.blockedUsers]];$("#cards").innerHTML=cards.map(c=>'<div class="card"><span>'+c[0]+'</span><strong>'+Number(c[1]).toLocaleString("pt-AO")+'</strong></div>').join("");chart($("#regchart"),d.registrations);chart($("#prodchart"),d.publications);}
async function users(){const q=new URLSearchParams({page:pages.users,limit:20,search:$("#usersearch").value,status:$("#userstatus").value});const d=await api("/users?"+q);$("#usertable").innerHTML=d.users.map(u=>'<tr><td><b>#'+u.id+' '+esc(u.name)+'</b><br><span class="muted">'+esc(u.email)+'</span></td><td>'+esc(u.phone)+'</td><td>'+date(u.created_at)+'</td><td>'+u.product_count+'</td><td><span class="pill '+(u.is_blocked?'blocked':'')+'">'+(u.is_blocked?'Bloqueado':'Ativo')+'</span></td><td><div class="actions"><button class="secondary" data-user="'+u.id+'" data-block="'+(!u.is_blocked)+'">'+(u.is_blocked?'Desbloquear':'Bloquear')+'</button><button class="danger" data-delete-user="'+u.id+'">Eliminar</button></div></td></tr>').join("")||'<tr><td colspan="6" class="empty">Nenhum utilizador encontrado.</td></tr>';$("#userpage").textContent='Página '+d.page+' de '+Math.max(1,d.pages)+' · '+d.total+' utilizadores';$("#userprev").disabled=d.page<=1;$("#usernext").disabled=d.page>=d.pages;$("#usertable").querySelectorAll("[data-user]").forEach(b=>b.onclick=safeAction(async()=>{const reason=b.dataset.block==="true"?prompt("Motivo do bloqueio (opcional):"):"";if(b.dataset.block==="true"&&reason===null)return;await api("/users/"+b.dataset.user+"/status",{method:"PATCH",body:JSON.stringify({blocked:b.dataset.block==="true",reason})});msg("Estado do utilizador atualizado.");await users();}));$("#usertable").querySelectorAll("[data-delete-user]").forEach(b=>b.onclick=safeAction(async()=>{const reason=prompt("Motivo da eliminação:");if(reason===null)return;if(!confirm("Eliminar definitivamente este utilizador e os dados associados? Esta ação não pode ser desfeita."))return;await api("/users/"+b.dataset.deleteUser,{method:"DELETE",body:JSON.stringify({reason})});msg("Utilizador eliminado.");await users();}));}
async function products(){const q=new URLSearchParams({page:pages.products,limit:20,search:$("#productsearch").value,status:$("#productstatus").value});const d=await api("/products?"+q);$("#producttable").innerHTML=d.products.map(p=>'<tr><td><b>#'+p.id+' '+esc(p.name)+'</b><br><span class="muted">'+date(p.created_at)+'</span></td><td>'+money(p.price)+'</td><td>'+esc(p.category)+'<br>'+esc(p.city)+'</td><td>'+esc(p.seller_name)+'<br><span class="muted">'+esc(p.seller_email)+'</span></td><td><span class="pill '+(p.is_blocked?'blocked':'')+'">'+(p.is_blocked?'Suspenso':'Ativo')+'</span></td><td><div class="actions"><button class="secondary" data-product="'+p.id+'" data-block="'+(!p.is_blocked)+'">'+(p.is_blocked?'Reativar':'Suspender')+'</button><button class="danger" data-delete-product="'+p.id+'">Eliminar</button></div></td></tr>').join("")||'<tr><td colspan="6" class="empty">Nenhum anúncio encontrado.</td></tr>';$("#productpage").textContent='Página '+d.page+' de '+Math.max(1,d.pages)+' · '+d.total+' anúncios';$("#productprev").disabled=d.page<=1;$("#productnext").disabled=d.page>=d.pages;$("#producttable").querySelectorAll("[data-product]").forEach(b=>b.onclick=safeAction(async()=>{const reason=b.dataset.block==="true"?prompt("Motivo da suspensão (opcional):"):"";if(b.dataset.block==="true"&&reason===null)return;await api("/products/"+b.dataset.product+"/status",{method:"PATCH",body:JSON.stringify({blocked:b.dataset.block==="true",reason})});msg("Estado do anúncio atualizado.");await products();}));$("#producttable").querySelectorAll("[data-delete-product]").forEach(b=>b.onclick=safeAction(async()=>{if(!confirm("Eliminar definitivamente este anúncio?"))return;await api("/products/"+b.dataset.deleteProduct,{method:"DELETE",body:JSON.stringify({reason:"Eliminação confirmada no painel"})});msg("Anúncio eliminado.");await products();}));}
async function audit(){const d=await api("/audit-logs?page="+pages.audit+"&limit=30");$("#audittable").innerHTML=d.logs.map(l=>'<tr><td>'+date(l.created_at)+'</td><td>'+esc(l.admin_email)+'</td><td>'+esc(l.action)+'</td><td>'+esc(l.target_type)+' #'+esc(l.target_id)+'</td><td>'+esc(l.reason||"—")+'</td></tr>').join("")||'<tr><td colspan="5" class="empty">Ainda não há operações registadas.</td></tr>';$("#auditpage").textContent='Página '+d.page+' de '+Math.max(1,d.pages)+' · '+d.total+' registos';$("#auditprev").disabled=d.page<=1;$("#auditnext").disabled=d.page>=d.pages;}
async function load(){if(active==="overview")await overview();if(active==="users")await users();if(active==="products")await products();if(active==="audit")await audit();}
function tab(name){active=name;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));["overview","users","products","audit"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==name));$("#title").textContent=({overview:"Visão geral",users:"Gestão de utilizadores",products:"Moderação de anúncios",audit:"Registo de auditoria"})[name];load().catch(e=>msg(e.message,true));}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>tab(b.dataset.tab));$("#refresh").onclick=()=>load().catch(e=>msg(e.message,true));$("#userfind").onclick=()=>{pages.users=1;users().catch(e=>msg(e.message,true));};$("#productfind").onclick=()=>{pages.products=1;products().catch(e=>msg(e.message,true));};
["user","product","audit"].forEach(k=>{const key=k==="user"?"users":k==="product"?"products":"audit";$("#"+k+"prev").onclick=()=>{pages[key]=Math.max(1,pages[key]-1);load().catch(e=>msg(e.message,true));};$("#"+k+"next").onclick=()=>{pages[key]++;load().catch(e=>msg(e.message,true));};});
$("#logout").onclick=()=>location.href="/";tab("overview");
</script></body></html>
