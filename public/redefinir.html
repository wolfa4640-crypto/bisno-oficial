<!doctype html>
<html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#176b45"><title>Definir nova palavra-passe · Bisno</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17251d;background:#eef5ef;--green:#176b45;--line:#dfe8e1;--muted:#637268}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top left,#d8ebdd,transparent 45%),#f4f8f5}.card{width:min(100%,460px);background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,38px);box-shadow:0 20px 60px #173c2514}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{display:grid;place-items:center;width:48px;height:48px;background:var(--green);color:white;border-radius:15px;font-size:25px;font-weight:900}.brand b{font-size:25px;letter-spacing:-.7px}.brand small{display:block;color:var(--muted);margin-top:2px}h1{font-size:26px;letter-spacing:-.7px;margin:0 0 10px}p{color:var(--muted);line-height:1.55;font-size:14px}form{display:grid;gap:10px;margin-top:22px}label{font-size:13px;font-weight:750;margin-top:5px}input{padding:14px;border:1px solid #d5e0d7;border-radius:11px;font:inherit;width:100%}input:focus{outline:3px solid #176b4520;border-color:var(--green)}button{border:0;border-radius:11px;background:var(--green);color:white;padding:14px;font:inherit;font-weight:800;cursor:pointer;margin-top:7px}button:disabled{opacity:.6}.message{padding:12px;border-radius:10px;background:#eff6f0;color:#254f35;line-height:1.5;font-size:14px}.message:empty{display:none}.back{display:block;text-align:center;margin-top:18px;color:var(--green);font-weight:700;text-decoration:none;font-size:14px}
</style></head><body><main class="card"><div class="brand"><div class="logo">B</div><div><b>Bisno</b><small>Recuperação segura da conta</small></div></div><h1>Define uma nova palavra-passe</h1><p>O teu pedido foi autorizado pelo administrador. Escolhe uma palavra-passe nova com pelo menos 8 caracteres. Por segurança, este link só pode ser usado uma vez e expira em 60 minutos.</p><form id="reset-form"><label for="password">Nova palavra-passe</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><label for="confirm">Confirmar palavra-passe</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required><button id="submit" type="submit">Guardar nova palavra-passe</button></form><p id="message" class="message" role="status" aria-live="polite"></p><a class="back" href="/acesso.html">Voltar ao início de sessão</a></main>
<script>
const token=new URLSearchParams(location.search).get("token")||"",form=document.querySelector("#reset-form"),message=document.querySelector("#message"),button=document.querySelector("#submit");
if(token.length<40){form.hidden=true;message.textContent="O link de recuperação é inválido. Pede uma nova recuperação de palavra-passe.";}
form.addEventListener("submit",async e=>{e.preventDefault();const password=document.querySelector("#password").value,confirm=document.querySelector("#confirm").value;if(password!==confirm){message.textContent="As palavras-passe não coincidem.";return;}button.disabled=true;message.textContent="A guardar a nova palavra-passe…";try{const response=await fetch("/api/auth/complete-password-reset",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.erro||"Não foi possível alterar a palavra-passe.");form.hidden=true;message.textContent=data.mensagem||"Palavra-passe alterada. Já podes iniciar sessão.";history.replaceState(null,"",location.pathname);}catch(err){message.textContent=err.message;}finally{button.disabled=false;}});
</script></body></html>
